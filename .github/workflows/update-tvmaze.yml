name: Update TVMaze episode snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-tvmaze.mjs
      - run: node scripts/audit-data.mjs
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tvmaze
          git diff --cached --quiet || git commit -m "chore: refresh TVMaze episode snapshots"
          git push
